<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table {
            border-collapse: collapse;
        }
        td {
            border: 1px solid black;
        }
    </style>
</head>
<body>
    <table>
        <caption>Weekly Timetable</caption>
        <tr>
            <td>Day</td>
            <td>9-10</td>
            <td>10-11</td>
            <td>11-12</td>
        </tr>
        <tr>
            <td>Mon</td>
            <td>Maths</td>
            <td>HTML</td>
            <td rowspan="2">Web Lab</td>
        </tr>
        <tr>
            <td>Tue</td>
            <td>DBMS</td>
            <td>OS</td>
        </tr>
        <tr>
            <td>Wed</td>
            <td colspan="3">Seminar</td>
        </tr>

    </table>
</body>
</html>
