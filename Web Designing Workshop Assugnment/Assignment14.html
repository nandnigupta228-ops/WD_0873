<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nested and responsive table</title>
    <style>
        table {
            border-collapse: collapse;
        }
        td {
            border: 1px solid black;
        }
    </style>
</head>
<body>
    <table>
        <tr>
            <td>Day</td>
            <td>Lab Batches</td>
            <td>Faculty</td>
            <td>Room</td>
            <td>Time</td>
        </tr>
        <tr>
            <td>Friday</td>
            <td>
                <table border="1">
                    <tr>
                        <td>Batch</td>
                        <td>System</td>
                    </tr>
                    <tr>
                        <td>A1</td>
                        <td>PC 1-20</td>
                    </tr>
                    <tr>
                        <td>A2</td>
                        <td>PC 21-40</td>
                    </tr>
                </table>
            </td>
            <td>Dr. Sharma</td>
            <td>Lab 2</td>
            <td>2-4 PM</td>
        </tr>
    </table>
</body>
</html>
