<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <label for="name"></label>
        <input type="text" id="name" name="name" placeholder="Full name" required><br><br>
        <label for="email"></label>
        <input type="email" id="email" name="email" placeholder="you@college.edu" required><br><br>
        <label for="tel"></label>
        <input type="tel" id="tel" name="tel" placeholder="10 digit mobile" minlength="10" maxlength="10" required ><br><br>
        <label for="password"></label>
        <input type="password" id="password" name="password" placeholder="min 6 digit character" required><br><br>
        <label for="age"></label>
        <input type="number" id="age" name="age" placeholder="Age=17" min="0" max="30" required><br><br>
        <button type="register">Register</button>
    </form>
</body>
</html>
