<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1,h3 {
            text-align: center;
            color: white;
            background-color: blue;
        }
        table,tr,td,th {
            border: 1px solid black;
            border-collapse: collapse;
            padding: 10px;
        }
    </style>
</head>
<body>
    <h1>ABC College Admission 2026</h1>
    <h2>Courses and Fees</h2>
    <table>
        <caption>Available Courses</caption>
        <tr>
            <th>Courses</th>
            <th>Seats</th>
            <th>Fees</th>
        </tr>
        <tr>
            <td>B.Tech CSE</td>
            <td>120</td>
            <td>₹90,000</td>
        </tr>
        <tr>
            <td>BCA</td>
            <td>60</td>
            <td>₹45,000</td>
        </tr>
    </table>
    <fieldset> 
        <legend>Application Form</legend>
        <label for="name">Name:</label><br>
        <input type="text" id="name" name="name"><br><br>
        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email"><br><br>
        <label for="course">Select Course:</label><br>
        <select id="course" name="course">
            <option value="btech">B.Tech CSE</option>
            <option value="bca">BCA</option>
        </select><br><br>
        <label for="statement">Statement:</label><br>
        <textarea id="statement" name="statement" rows="4" cols="50"></textarea><br><br>
        <button type="submit">Apply</button>
    </fieldset>
    <h3>&copy; 2026 ABC College</h3>
</body>
</html>
